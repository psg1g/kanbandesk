# Rate limiting: не более 10 запросов в минуту на IP для регистрации и входа.
# burst даёт запас на редкие параллельные запросы, nodelay — мгновенный 429 сверх лимита.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Регистрация и вход — строгий лимит 10 запросов/минуту с IP
    location = /api/auth/register/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Django (CSS/JS админ-панели) — без этого admin рендерится «голым» HTML
    location /static/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://app:8000;
    }

    # Публичные изображения (jpg/png/webp) — отдают файлы с тома uploads
    location ~ ^/media/public/(?<fname>.+\.(jpg|jpeg|png|webp))$ {
        alias /uploads/public/$fname;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA: все маршруты React отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
